name: Release
on:
  push:
    branches:
      - master

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@main
        with:
          role-to-assume: arn:aws:iam::196791952225:role/GitHub-S3-kurier-static-unprivileged
          aws-region: eu-central-1
      - run: aws s3 sync ./files s3://kurier-static/one-app --exclude .gitignore